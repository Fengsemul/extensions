<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>LeanSERP Filter v2</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family:
                system-ui,
                -apple-system,
                "Segoe UI",
                sans-serif;
            font-size: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 290px;
            margin: 0;
            background: Canvas;
            color: CanvasText;
        }

        main {
            display: grid;
            gap: 12px;
            padding: 14px;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
        }

        p {
            margin: 0;
            color: color-mix(
                in srgb,
                CanvasText 72%,
                transparent
            );
            line-height: 1.45;
        }

        button {
            width: 100%;
            min-height: 38px;
            border: 1px solid color-mix(
                in srgb,
                CanvasText 30%,
                transparent
            );
            border-radius: 7px;
            padding: 8px 12px;
            background: ButtonFace;
            color: ButtonText;
            cursor: pointer;
            font: inherit;
        }

        button:hover {
            filter: brightness(1.05);
        }

        button:disabled {
            cursor: default;
            opacity: 0.6;
        }

        #status {
            min-height: 20px;
            font-size: 0.84rem;
        }

        #status[data-state="error"] {
            color: #c62828;
        }
    </style>
</head>
<body>
    <main>
        <h1>LeanSERP Filter v2</h1>

        <p>
            Open the persistent manager to import, replace,
            inspect, or remove rule packages and manual files.
        </p>

        <button
            id="open-manager"
            type="button"
        >
            Open LeanSERP Manager
        </button>

        <button
            id="open-options"
            type="button"
        >
            Open resource options
        </button>

        <p
            id="status"
            role="status"
            aria-live="polite"
        ></p>
    </main>

    <script src="launcher.js"></script>
</body>
</html>
